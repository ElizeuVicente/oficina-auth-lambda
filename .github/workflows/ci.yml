name: CI
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn --batch-mode verify
      - name: Validar classes dos handlers na raiz do JAR Lambda
        run: |
          artifact="$(find target -maxdepth 1 -name '*-lambda.jar' -print -quit)"
          test -s "$artifact"
          jar tf "$artifact" | grep -Fx 'com/oficina/auth/CpfLambdaHandler.class'
          jar tf "$artifact" | grep -Fx 'com/oficina/auth/JwtAuthorizerHandler.class'
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: Validate Lambda/API Gateway Terraform without provisioning
        working-directory: aws
        run: |
          terraform init -backend=false -input=false
          terraform validate
